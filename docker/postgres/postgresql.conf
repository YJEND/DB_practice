# ==================================================================
# 실습용 PostgreSQL 18 설정
# 컨테이너에 /etc/postgresql/postgresql.conf 로 마운트되며,
# 값을 바꾼 뒤에는 `make restart-pg` 로 재시작해야 반영됩니다.
# (shared_preload_libraries 처럼 재시작이 필요한 항목과,
#  SET 으로 세션에서 바꿀 수 있는 항목이 섞여 있습니다.)
# ==================================================================

# --- 접속 ----------------------------------------------------------
listen_addresses = '*'
max_connections = 100

# --- 메모리 ----------------------------------------------------------
# 16GB 머신 기준. shared_buffers 를 일부러 작게(1GB) 잡아
# large 시드(수 GB)가 캐시에 다 안 올라가는 상황을 만듭니다.
shared_buffers = 1GB
effective_cache_size = 3GB
# work_mem 은 기본값(4MB) 그대로 둡니다. 정렬/해시가 디스크로 넘치는(temp) 상황을
# 먼저 보고, 실습에서 SET work_mem = '64MB' 등으로 바꿔가며 비교하세요.
work_mem = 4MB
maintenance_work_mem = 512MB
max_parallel_maintenance_workers = 4

# --- WAL / 체크포인트 ----------------------------------------------------
# 대량 시드 시 체크포인트가 너무 자주 일어나지 않도록 넉넉히
max_wal_size = 4GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9

# --- 플래너 ----------------------------------------------------------
# random_page_cost 는 기본값(4.0)입니다. SSD 환경에서 왜 1.1 정도로 낮추는지는
# 01-index-explain 에서 직접 비교해 보세요.  (세션에서 SET 으로 변경 가능)
#random_page_cost = 1.1

# --- 확장 (재시작 필요) ------------------------------------------------
shared_preload_libraries = 'pg_stat_statements,auto_explain'

# pg_stat_statements
pg_stat_statements.max = 10000
pg_stat_statements.track = all
compute_query_id = auto

# auto_explain: 라이브러리는 로드하되 기본은 꺼둠 (-1).
# 켜는 방법은 README "auto_explain 켜기" 참고. 세션에서:
#   SET auto_explain.log_min_duration = 200;   -- 200ms 이상 쿼리 계획을 로그에 기록
auto_explain.log_min_duration = -1
auto_explain.log_analyze = on
auto_explain.log_buffers = on
auto_explain.log_timing = on
auto_explain.log_nested_statements = on

# --- 통계 / 로그 ----------------------------------------------------
# EXPLAIN (ANALYZE, BUFFERS) 에 I/O 시간이 표시되도록
track_io_timing = on
track_activities = on
track_counts = on

log_destination = 'stderr'
logging_collector = off            # docker logs 로 바로 봄
log_line_prefix = '%m [%p] %u@%d app=%a '
log_min_duration_statement = -1    # 02-slow-query 에서 필요하면 세션/전역으로 켬
log_lock_waits = on                # 락 대기 1초(deadlock_timeout) 이상이면 로그
deadlock_timeout = 1s
log_checkpoints = on
log_autovacuum_min_duration = 0    # 05-ops 에서 autovacuum 동작을 로그로 관찰

# --- 기타 ----------------------------------------------------------
timezone = 'Asia/Seoul'
log_timezone = 'Asia/Seoul'
